name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - run: pnpm run tauri:build:independent-1.3
      - name: Normalize release asset name
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle/nsis"
          $source = Get-ChildItem "$bundleDir/*.exe" | Select-Object -First 1
          if (-not $source) { throw "NSIS installer was not generated" }
          $version = "${{ github.ref_name }}".TrimStart("v")
          $target = Join-Path $bundleDir "DailyTaskMonitor-$version-x64-setup.exe"
          Move-Item -LiteralPath $source.FullName -Destination $target -Force
      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/DailyTaskMonitor-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/DailyTaskMonitor-*.exe
            src-tauri/target/release/bundle/nsis/DailyTaskMonitor-*.sha256
